<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running... -- Campaign Reporting Agent</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e26;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4338ca;
    --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card: #1e2029;
      --text: #eceef2;
      --muted: #9aa0ac;
      --border: #2e313c;
      --accent: #818cf8;
      --accent-soft: #262a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2.5rem 1rem;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1.25rem; display: flex; align-items: center; gap: 0.65rem; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--accent-soft);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .current-step { font-size: 0.98rem; font-weight: 500; margin-bottom: 1rem; min-height: 1.4em; }
  #log {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 1rem;
    font-size: 0.8rem;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    line-height: 1.6;
    max-height: 340px;
    overflow-y: auto;
    color: var(--muted);
  }
  #log .latest { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="spinner"></span> Running...</h1>
  <div class="card">
    <div class="current-step" id="current-step">Starting...</div>
    <div id="log"></div>
  </div>
</div>
<script>
  const runId = {{ run_id | tojson }};
  const logEl = document.getElementById("log");
  const stepEl = document.getElementById("current-step");

  async function poll() {
    try {
      const resp = await fetch(`/progress/${runId}/data`);
      const data = await resp.json();

      logEl.innerHTML = data.messages
        .map((m, i) => `<div${i === data.messages.length - 1 ? ' class="latest"' : ''}>${escapeHtml(m)}</div>`)
        .join("");
      logEl.scrollTop = logEl.scrollHeight;
      if (data.messages.length) {
        stepEl.textContent = data.messages[data.messages.length - 1];
      }

      if (data.status === "done" || data.status === "error") {
        window.location.href = `/results/${runId}`;
        return;
      }
    } catch (e) {
      // transient fetch error -- just try again on the next tick
    }
    setTimeout(poll, 1200);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  }

  poll();
</script>
</body>
</html>
