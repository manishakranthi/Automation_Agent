<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running... -- Campaign Reporting Agent</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e26;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4338ca;
    --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card: #1e2029;
      --text: #eceef2;
      --muted: #9aa0ac;
      --border: #2e313c;
      --accent: #818cf8;
      --accent-soft: #262a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2.5rem 1rem;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 2.5rem 2rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    text-align: center;
    width: 100%;
    max-width: 380px;
  }
  .ring-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; }
  .ring {
    width: 152px;
    height: 152px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 0deg 90deg, var(--accent-soft) 90deg 360deg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.5s ease;
  }
  .ring.indeterminate { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring-inner {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .percent { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .percent.hidden { display: none; }
  .dot-pulse { display: flex; gap: 0.35rem; }
  .dot-pulse span {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
  h1 { font-size: 1.15rem; margin: 0 0 0.4rem; font-weight: 600; }
  p { color: var(--muted); font-size: 0.9rem; margin: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="ring-wrap">
    <div class="ring indeterminate" id="ring">
      <div class="ring-inner">
        <div class="percent hidden" id="percent">0%</div>
        <div class="dot-pulse" id="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
  <h1 id="status-label">Getting started&hellip;</h1>
  <p>This can take a few minutes -- feel free to leave this open.</p>
</div>
<script>
  const runId = {{ run_id | tojson }};
  const ring = document.getElementById("ring");
  const percentEl = document.getElementById("percent");
  const dotsEl = document.getElementById("dots");
  const statusEl = document.getElementById("status-label");

  const PHRASES = [
    [0, "Getting started&hellip;"],
    [1, "Fetching data&hellip;"],
    [40, "Matching campaigns&hellip;"],
    [80, "Almost there&hellip;"],
  ];

  function phraseFor(pct) {
    let chosen = PHRASES[0][1];
    for (const [threshold, phrase] of PHRASES) {
      if (pct >= threshold) chosen = phrase;
    }
    return chosen;
  }

  function setProgress(pct) {
    ring.classList.remove("indeterminate");
    dotsEl.style.display = "none";
    percentEl.classList.remove("hidden");
    ring.style.background = `conic-gradient(var(--accent) 0deg ${pct * 3.6}deg, var(--accent-soft) ${pct * 3.6}deg 360deg)`;
    percentEl.textContent = `${pct}%`;
    statusEl.innerHTML = phraseFor(pct);
  }

  async function poll() {
    try {
      const resp = await fetch(`/progress/${runId}/data`);
      const data = await resp.json();

      const latest = data.messages.length ? data.messages[data.messages.length - 1] : "";
      const match = latest.match(/\[(\d+)\/(\d+)\]/);
      if (match) {
        const pct = Math.round((parseInt(match[1], 10) / parseInt(match[2], 10)) * 100);
        setProgress(pct);
      }

      if (data.status === "done" || data.status === "error") {
        setProgress(100);
        setTimeout(() => { window.location.href = `/results/${runId}`; }, 300);
        return;
      }
    } catch (e) {
      // transient fetch error -- just try again on the next tick
    }
    setTimeout(poll, 600);
  }

  poll();
</script>
</body>
</html>
